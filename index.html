<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Obras Pro</title>
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --border: #334155;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg-main); color: var(--text-main); margin: 0; padding: 10px; }
        header { text-align: center; margin-bottom: 10px; }
        h1 { color: var(--accent); font-size: 1.2rem; margin: 4px 0; }
        p.subtitle { color: var(--text-muted); font-size: 0.75rem; margin: 0; }
        
        .tabs { display: flex; gap: 2px; margin-bottom: 12px; background: var(--bg-card); padding: 3px; border-radius: 8px; overflow-x: auto; }
        .tab-btn { flex: 1; min-width: 65px; padding: 8px 3px; background: none; border: none; color: var(--text-muted); font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 0.65rem; text-align: center; white-space: nowrap; }
        .tab-btn.active { background: var(--accent); color: #000; }
        
        .section { display: none; }
        .section.active { display: block; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
        h2 { font-size: 1rem; margin-top: 0; color: var(--accent); }
        
        label { display: block; margin-top: 6px; color: var(--text-muted); font-size: 0.75rem; }
        input, select, textarea { width: 100%; padding: 8px; margin-top: 3px; background: var(--bg-main); border: 1px solid var(--border); color: var(--text-main); border-radius: 6px; box-sizing: border-box; font-size: 0.85rem; }
        
        .btn-group { display: flex; gap: 6px; margin-top: 10px; }
        button.btn { width: 100%; padding: 10px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-whatsapp { background: #25D366; color: white; }
        
        .resumen-box { background: var(--bg-main); border-left: 4px solid var(--accent); padding: 10px; margin-top: 10px; font-size: 0.8rem; border-radius: 4px; line-height: 1.4; }
        .item-list { margin-top: 8px; }
        .item-row { display: flex; justify-content: space-between; align-items: center; background: var(--bg-main); padding: 8px 10px; border-radius: 6px; margin-bottom: 5px; font-size: 0.8rem; border: 1px solid var(--border); }
        .balance-total { font-size: 1rem; font-weight: bold; text-align: center; padding: 8px; background: var(--bg-main); border-radius: 6px; margin-bottom: 8px; color: var(--success); }
    </style>
</head>
<body>

    <header>
        <h1>🏗️ ObrasPro Total</h1>
        <p class="subtitle">Sistema Integral para Contratistas</p>
    </header>

    <!-- Pestañas de Navegación -->
    <div class="tabs">
        <button class="tab-btn active" onclick="cambiarTab('presupuesto', this)">📋 Cotizar</button>
        <button class="tab-btn" onclick="cambiarTab('recibos', this)">📄 Recibo</button>
        <button class="tab-btn" onclick="cambiarTab('stock', this)">📦 Stock</button>
        <button class="tab-btn" onclick="cambiarTab('finanzas', this)">💰 Finanzas</button>
        <button class="tab-btn" onclick="cambiarTab('personal', this)">👷 Personal</button>
        <button class="tab-btn" onclick="cambiarTab('agenda', this)">📇 Agenda</button>
    </div>

    <!-- 1. COTIZADOR POR ETAPAS -->
    <div id="presupuesto" class="section active">
        <div class="card">
            <h2>Presupuesto por Etapas y M²</h2>
            <label>Cliente / Obra</label>
            <input type="text" id="cliente" placeholder="Ej: Roberto Gomez">

            <label>Etapa o Tipo de Trabajo</label>
            <select id="tipoTrabajo">
                <option value="cimiento">Cimientos / Excavación (M²)</option>
                <option value="pared">Elevación de Paredes (M²)</option>
                <option value="revoque">Revoques Fino / Grueso (M²)</option>
                <option value="techo">Techado / Losas (M²)</option>
            </select>

            <label>Superficie (M²)</label>
            <input type="number" id="superficie" placeholder="Ej: 50">

            <label>Mano de Obra por M² ($)</label>
            <input type="number" id="valorMano" placeholder="Ej: 9000">

            <button class="btn btn-primary" onclick="calcularPresupuesto()">⚙️ Calcular Cómputo</button>

            <div id="resultado" class="resumen-box" style="display:none;"></div>
            
            <div id="accionesPresupuesto" class="btn-group" style="display:none;">
                <button class="btn btn-whatsapp" onclick="enviarWhatsApp()">📲 Enviar Presupuesto</button>
            </div>
        </div>
    </div>

    <!-- 2. RECIBOS -->
    <div id="recibos" class="section">
        <div class="card">
            <h2>Generar Recibo de Pago</h2>
            <label>Cliente</label>
            <input type="text" id="recCliente" placeholder="Ej: Juan Perez">
            <label>Concepto</label>
            <input type="text" id="recConcepto" placeholder="Ej: Seña inicial de materiales">
            <label>Monto ($)</label>
            <input type="number" id="recMonto" placeholder="Ej: 60000">
            <button class="btn btn-whatsapp" onclick="enviarReciboWhatsApp()">📲 Enviar Recibo WhatsApp</button>
        </div>
    </div>

    <!-- 3. CONTROL DE STOCK -->
    <div id="stock" class="section">
        <div class="card">
            <h2>Registrar Ingreso de Materiales</h2>
            <label>Material (Cemento, Ladrillos, Arena)</label>
            <input type="text" id="stNombre" placeholder="Ej: Bolsas de Cemento Loma Negra">
            <label>Cantidad Comprada</label>
            <input type="number" id="stCantidad" placeholder="Ej: 50">
            <button class="btn btn-primary" onclick="agregarStock()">➕ Añadir al Pañol</button>
        </div>
        <div class="card">
            <h2>Estado del Pañol / Stock</h2>
            <div id="listaStock" class="item-list"></div>
        </div>
    </div>

    <!-- 4. FINANZAS -->
    <div id="finanzas" class="section">
        <div class="card">
            <h2>Gastos y Cobros</h2>
            <label>Concepto</label>
            <input type="text" id="finConcepto" placeholder="Ej: Compra de hierros">
            <label>Monto ($)</label>
            <input type="number" id="finMonto" placeholder="Ej: 120000">
            <label>Tipo</label>
            <select id="finTipo">
                <option value="gasto">🔻 Gasto</option>
                <option value="ingreso">🟢 Ingreso / Cobro</option>
            </select>
            <button class="btn btn-primary" onclick="agregarMovimiento()">Registrar Operación</button>
        </div>
        <div class="card">
            <h2>Balance Neto</h2>
            <div id="balanceDisplay" class="balance-total">Ganancia: $0</div>
            <div id="listaMovimientos" class="item-list"></div>
        </div>
    </div>

    <!-- 5. PERSONAL -->
    <div id="personal" class="section">
        <div class="card">
            <h2>Jornales de Personal</h2>
            <label>Nombre del Trabajador</label>
            <input type="text" id="nombrePersonal" placeholder="Ej: Carlos Gomez">
            <label>Jornal Diario ($)</label>
            <input type="number" id="jornalPersonal" placeholder="Ej: 22000">
            <label>Días Trabajados</label>
            <input type="number" id="diasPersonal" placeholder="Ej: 6">
            <button class="btn btn-primary" onclick="agregarPersonal()">Calcular Semana</button>
        </div>
        <div class="card">
            <h2>Planilla de Pagos</h2>
            <div id="listaPersonal" class="item-list"></div>
        </div>
    </div>

    <!-- 6. AGENDA -->
    <div id="agenda" class="section">
        <div class="card">
            <h2>Agenda y Corralones</h2>
            <label>Nombre</label>
            <input type="text" id="agNombre" placeholder="Ej: Corralón Central">
            <label>Teléfono</label>
            <input type="tel" id="agTelefono" placeholder="Ej: 3624...">
            <label>Notas / Precios</label>
            <textarea id="agNotas" rows="2" placeholder="Presupuestos y referencias"></textarea>
            <button class="btn btn-primary" onclick="agregarContacto()">Guardar Contacto</button>
        </div>
        <div class="card">
            <h2>Contactos Útiles</h2>
            <div id="listaAgenda" class="item-list"></div>
        </div>
    </div>

    <script>
        let ultimoPresupuestoTexto = "";
        function cambiarTab(tabId, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function calcularPresupuesto() {
            const cliente = document.getElementById('cliente').value || 'Cliente';
            const superficie = parseFloat(document.getElementById('superficie').value) || 0;
            const valorMano = parseFloat(document.getElementById('valorMano').value) || 0;
            const tipo = document.getElementById('tipoTrabajo').value;
            if (superficie <= 0 || valorMano <= 0) return alert('Completa superficie y mano de obra.');

            let matTexto = "";
            let manoObraTotal = superficie * valorMano;

            if (tipo === 'pared') {
                matTexto = `• Ladrillos: ${Math.round(superficie * 90)} un.\n• Cemento: ${Math.ceil(superficie * 0.35)} bolsas\n• Arena: ${(superficie * 0.08).toFixed(2)} m³`;
            } else if (tipo === 'revoque') {
                matTexto = `• Cemento: ${Math.ceil(superficie * 0.15)} bolsas\n• Cal: ${Math.ceil(superficie * 0.25)} bolsas\n• Arena: ${(superficie * 0.05).toFixed(2)} m³`;
            } else if (tipo === 'cimiento') {
                matTexto = `• Hormigón / Cascote: ${(superficie * 0.2).toFixed(2)} m³\n• Cemento: ${Math.ceil(superficie * 0.4)} bolsas`;
            } else {
                matTexto = `• Materiales de losa / viguetas según plano`;
            }

            ultimoPresupuestoTexto = `🏗️ *PRESUPUESTO - OBRAS PRO*\n👤 *Cliente:* ${cliente}\n📐 *Etapa:* ${tipo.toUpperCase()} (${superficie} M²)\n--------------------------------\n📦 *Materiales Estimados:*\n${matTexto}\n--------------------------------\n💰 *Mano de Obra Total:* $${manoObraTotal.toLocaleString()}`;
            const resDiv = document.getElementById('resultado');
            resDiv.style.display = 'block';
            resDiv.innerText = ultimoPresupuestoTexto;
            document.getElementById('accionesPresupuesto').style.display = 'flex';
        }

        function enviarWhatsApp() {
            if (ultimoPresupuestoTexto) window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(ultimoPresupuestoTexto)}`, '_blank');
        }

        function enviarReciboWhatsApp() {
            const cliente = document.getElementById('recCliente').value || 'Cliente';
            const concepto = document.getElementById('recConcepto').value || 'Pago de obra';
            const monto = parseFloat(document.getElementById('recMonto').value) || 0;
            if (monto <= 0) return alert('Ingresa un monto.');
            const texto = `🧾 *RECIBO DE PAGO - OBRAS PRO*\n📅 *Fecha:* ${new Date().toLocaleDateString()}\n👤 *Cliente:* ${cliente}\n📝 *Concepto:* ${concepto}\n💵 *Monto:* $${monto.toLocaleString()}\n--------------------------------\n✅ ¡Gracias por confiar en nosotros!`;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`, '_blank');
        }

        let stock = JSON.parse(localStorage.getItem('obras_stock')) || [];
        function agregarStock() {
            const nombre = document.getElementById('stNombre').value;
            const cantidad = parseFloat(document.getElementById('stCantidad').value) || 0;
            if (!nombre || cantidad <= 0) return alert('Completa los datos.');
            stock.push({ nombre, cantidad });
            localStorage.setItem('obras_stock', JSON.stringify(stock));
            document.getElementById('stNombre').value = '';
            document.getElementById('stCantidad').value = '';
            renderStock();
        }
        function renderStock() {
            const lista = document.getElementById('listaStock');
            lista.innerHTML = '';
            stock.forEach(s => {
                lista.innerHTML += `<div class="item-row"><span>📦 ${s.nombre}</span><strong>Stock: ${s.cantidad}</strong></div>`;
            });
        }

        let movimientos = JSON.parse(localStorage.getItem('obras_movs')) || [];
        function agregarMovimiento() {
            const conc = document.getElementById('finConcepto').value;
            const monto = parseFloat(document.getElementById('finMonto').value) || 0;
            const tipo = document.getElementById('finTipo').value;
            if (!conc || monto <= 0) return alert('Completa concepto y monto.');
            movimientos.push({ conc, monto, tipo });
            localStorage.setItem('obras_movs', JSON.stringify(movimientos));
            document.getElementById('finConcepto').value = '';
            document.getElementById('finMonto').value = '';
            renderFinanzas();
        }
        function renderFinanzas() {
            const lista = document.getElementById('listaMovimientos');
            lista.innerHTML = '';
            let total = 0;
            movimientos.forEach(m => {
                if (m.tipo === 'ingreso') total += m.monto;
                else total -= m.monto;
                lista.innerHTML += `<div class="item-row"><span>${m.tipo === 'ingreso' ? '🟢' : '🔻'} ${m.conc}</span><strong>$${m.monto.toLocaleString()}</strong></div>`;
            });
            const bal = document.getElementById('balanceDisplay');
            bal.innerText = `Ganancia Neta: $${total.toLocaleString()}`;
            bal.style.color = total >= 0 ? 'var(--success)' : 'var(--danger)';
        }

        let personal = JSON.parse(localStorage.getItem('obras_personal')) || [];
        function agregarPersonal() {
            const nombre = document.getElementById('nombrePersonal').value;
            const jornal = parseFloat(document.getElementById('jornalPersonal').value) || 0;
            const dias = parseFloat(document.getElementById('diasPersonal').value) || 0;
            if (!nombre || jornal <= 0 || dias <= 0) return alert('Completa datos de personal.');
            personal.push({ nombre, total: jornal * dias, dias });
            localStorage.setItem('obras_personal', JSON.stringify(personal));
            document.getElementById('nombrePersonal').value = '';
            document.getElementById('jornalPersonal').value = '';
            document.getElementById('diasPersonal').value = '';
            renderPersonal();
        }
        function renderPersonal() {
            const lista = document.getElementById('listaPersonal');
            lista.innerHTML = '';
            personal.forEach(p => {
                lista.innerHTML += `<div class="item-row"><span>👷 ${p.nombre} (${p.dias} días)</span><strong>$${p.total.toLocaleString()}</strong></div>`;
            });
        }

        let agenda = JSON.parse(localStorage.getItem('obras_agenda')) || [];
        function agregarContacto() {
            const nombre = document.getElementById('agNombre').value;
            const tel = document.getElementById('agTelefono').value;
            const notas = document.getElementById('agNotas').value;
            if (!nombre) return alert('Ingresa un nombre.');
            agenda.push({ nombre, tel, notas });
            localStorage.setItem('obras_agenda', JSON.stringify(agenda));
            document.getElementById('agNombre').value = '';
            document.getElementById('agTelefono').value = '';
            document.getElementById('agNotas').value = '';
            renderAgenda();
        }
        function renderAgenda() {
            const lista = document.getElementById('listaAgenda');
            lista.innerHTML = '';
            agenda.agenda = agenda || [];
            agenda.forEach(a => {
                lista.innerHTML += `<div class="item-row" style="flex-direction:column; align-items:flex-start;"><strong>👤 ${a.nombre} ${a.tel ? '- 📞 ' + a.tel : ''}</strong><small style="color:var(--text-muted);">${a.notas}</small></div>`;
            });
        }

        renderStock();
        renderFinanzas();
        renderPersonal();
        renderAgenda();
    </script>
</body>
</html>
