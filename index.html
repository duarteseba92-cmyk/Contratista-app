<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Obra & Presupuestos</title>
    <!-- Configuración para que parezca una App instalada -->
    <meta name="theme-color" content="#1e1e1e">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; margin: 0; padding: 15px; }
        h1, h2 { color: #ff9800; text-align: center; }
        h1 { font-size: 1.4rem; margin-bottom: 20px; }
        .card { background: #1e1e1e; border: 1px solid #333; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        label { display: block; margin-top: 10px; color: #aaa; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 14px; font-weight: bold; border: none; border-radius: 6px; margin-top: 15px; cursor: pointer; font-size: 1rem; }
        .btn-calcular { background: #ff9800; color: #000; }
        .btn-whatsapp { background: #25D366; color: white; }
        .resumen { background: #252525; border-left: 4px solid #ff9800; padding: 12px; margin-top: 15px; border-radius: 4px; }
        .materia-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #333; font-size: 0.95rem; }
    </style>
</head>
<body>

    <h1>🏗️ Control de Obra Contratista</h1>

    <!-- MODULO 1: DATOS DE LA OBRA -->
    <div class="card">
        <h2>1. Datos del Cliente</h2>
        <label>Nombre del Cliente</label>
        <input type="text" id="cliente" placeholder="Ej: Juan Pérez">
        
        <label>Tipo de Trabajo</label>
        <select id="tipoTrabajo">
            <option value="pared">Construcción de Pared (M2)</option>
            <option value="pintura">Pintura de Interiores (M2)</option>
        </select>

        <label>Superficie Total (Metros Cuadrados)</label>
        <input type="number" id="medidaM2" placeholder="Ej: 25">
    </div>

    <!-- MODULO 2: MANO DE OBRA -->
    <div class="card">
        <h2>2. Costo Mano de Obra</h2>
        <label>Precio de Mano de Obra por M2 ($)</label>
        <input type="number" id="costoManoObra" placeholder="Ej: 5000">
    </div>

    <button class="btn-calcular" onclick="calcularTodo()">📐 Calcular Presupuesto</button>

    <!-- MODULO 3: RESULTADOS -->
    <div class="card" id="resultadoCard" style="display:none;">
        <h2>3. Resumen de Costos</h2>
        <div id="listaMateriales"></div>
        
        <div class="resumen">
            <p><strong>Costo Materiales:</strong> $<span id="totalMateriales">0</span></p>
            <p><strong>Mano de Obra:</strong> $<span id="totalManoObra">0</span></p>
            <h3 style="color:#4CAF50; margin:8px 0;">TOTAL: $<span id="totalGeneral">0</span></h3>
        </div>
        
        <button class="btn-whatsapp" onclick="compartirWhatsApp()">📱 Enviar Presupuesto por WhatsApp</button>
    </div>

    <script>
        const PRECIOS = {
            ladrillo: 250,
            bolsaCemento: 8500,
            baldePintura: 45000
        };

        function calcularTodo() {
            const tipo = document.getElementById("tipoTrabajo").value;
            const m2 = parseFloat(document.getElementById("medidaM2").value) || 0;
            const costoManoObraM2 = parseFloat(document.getElementById("costoManoObra").value) || 0;

            if (m2 <= 0) {
                alert("Por favor ingresa una cantidad de M2 válida.");
                return;
            }

            let htmlMateriales = "";
            let costoMateriales = 0;

            if (tipo === "pared") {
                const cantLadrillos = Math.ceil(m2 * 12);
                const cantCemento = (m2 * 0.1).toFixed(1);

                const subLadrillos = cantLadrillos * PRECIOS.ladrillo;
                const subCemento = cantCemento * PRECIOS.bolsaCemento;
                costoMateriales = subLadrillos + subCemento;

                htmlMateriales = `
                    <div class="materia-item"><span>Ladrillos (${cantLadrillos} un):</span> <strong>$${subLadrillos.toLocaleString()}</strong></div>
                    <div class="materia-item"><span>Cemento (${cantCemento} bolsas):</span> <strong>$${subCemento.toLocaleString()}</strong></div>
                `;
            } else if (tipo === "pintura") {
                const baldes = Math.ceil(m2 / 60);
                costoMateriales = baldes * PRECIOS.baldePintura;

                htmlMateriales = `
                    <div class="materia-item"><span>Pintura 20L (${baldes} balde/s):</span> <strong>$${costoMateriales.toLocaleString()}</strong></div>
                `;
            }

            const totalManoObra = m2 * costoManoObraM2;
            const totalGeneral = costoMateriales + totalManoObra;

            document.getElementById("listaMateriales").innerHTML = htmlMateriales;
            document.getElementById("totalMateriales").innerText = costoMateriales.toLocaleString();
            document.getElementById("totalManoObra").innerText = totalManoObra.toLocaleString();
            document.getElementById("totalGeneral").innerText = totalGeneral.toLocaleString();

            document.getElementById("resultadoCard").style.display = "block";
        }

        function compartirWhatsApp() {
            const cliente = document.getElementById("cliente").value || "Cliente";
            const total = document.getElementById("totalGeneral").innerText;
            const texto = `Hola *${cliente}*, te envío el presupuesto estimado para la obra:\n\n*Total General: $${total}*\n\nGenerado con App Contratista.`;
            
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`, '_blank');
        }
    </script>
</body>
</html>
