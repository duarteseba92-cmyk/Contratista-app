<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Obras Pro - Contratista</title>
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --border: #334155;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg-main); color: var(--text-main); margin: 0; padding: 15px; }
        header { text-align: center; margin-bottom: 15px; }
        h1 { color: var(--accent); font-size: 1.3rem; margin: 5px 0; }
        p.subtitle { color: var(--text-muted); font-size: 0.8rem; margin: 0; }
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; background: var(--bg-card); padding: 5px; border-radius: 8px; }
        .tab-btn { flex: 1; padding: 10px; background: none; border: none; color: var(--text-muted); font-weight: bold; border-radius: 6px; cursor: pointer; }
        .tab-btn.active { background: var(--accent); color: #000; }
        .section { display: none; }
        .section.active { display: block; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        label { display: block; margin-top: 8px; color: var(--text-muted); font-size: 0.85rem; }
        input, select { width: 100%; padding: 10px; margin-top: 4px; background: var(--bg-main); border: 1px solid var(--border); color: var(--text-main); border-radius: 6px; box-sizing: border-box; }
        button.btn { width: 100%; padding: 12px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin-top: 15px; }
        .btn-primary { background: var(--accent); color: #000; }
        .resumen-box { background: var(--bg-main); border-left: 4px solid var(--accent); padding: 10px; margin-top: 10px; font-size: 0.9rem; border-radius: 4px; }
        
        /* Ocultar anuncios inyectados por AppsGeyser */
        iframe[src*="appsgeyser"], div[id*="banner"], div[class*="banner"] {
            display: none !important;
            height: 0 !important;
            visibility: hidden !important;
        }
    </style>
</head>
<body>

    <header>
        <h1>🏗️ Gestión de Obras Pro</h1>
        <p class="subtitle">Herramienta profesional para contratistas</p>
    </header>

    <!-- Pestañas de Navegación -->
    <div class="tabs">
        <button class="tab-btn active" onclick="cambiarTab('presupuesto', this)">Presupuestos</button>
        <button class="tab-btn" onclick="cambiarTab('historial', this)">Guardados</button>
        <button class="tab-btn" onclick="cambiarTab('gastos', this)">Gastos Diarios</button>
    </div>

    <!-- Sección Presupuestos -->
    <div id="presupuesto" class="section active">
        <div class="card">
            <label>Cliente / Obra</label>
            <input type="text" id="cliente" placeholder="Ej: Roberto Gomez">

            <label>Tipo de Trabajo</label>
            <select id="tipoTrabajo">
                <option value="pared">Construcción de Pared (M²)</option>
                <option value="revoque">Revoque Fino / Grueso (M²)</option>
                <option value="piso">Colocación de Pisos (M²)</option>
            </select>

            <label>Superficie (M²)</label>
            <input type="number" id="superficie" placeholder="Ej: 40">

            <label>Valor Mano de Obra por M² ($)</label>
            <input type="number" id="valorMano" placeholder="Ej: 8000">

            <button class="btn btn-primary" onclick="calcular()">⚙️ Calcular Cómputo y Presupuesto</button>

            <div id="resultado" class="resumen-box" style="display:none;"></div>
        </div>
    </div>

    <!-- Sección Historial -->
    <div id="historial" class="section">
        <div class="card">
            <p style="color: var(--text-muted); text-align: center;">Tus presupuestos guardados aparecerán aquí.</p>
        </div>
    </div>

    <!-- Sección Gastos Diarios -->
    <div id="gastos" class="section">
        <div class="card">
            <p style="color: var(--text-muted); text-align: center;">Control de gastos de materiales y movilidad.</p>
        </div>
    </div>

    <script>
        function cambiarTab(tabId, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function calcular() {
            const superficie = parseFloat(document.getElementById('superficie').value) || 0;
            const valorMano = parseFloat(document.getElementById('valorMano').value) || 0;
            const cliente = document.getElementById('cliente').value || 'Sin nombre';

            if (superficie <= 0 || valorMano <= 0) {
                alert('Por favor completa los valores de superficie y mano de obra.');
                return;
            }

            // Cálculos básicos estimativos de materiales para pared
            const ladrillos = Math.round(superficie * 90);
            const cementoBolsas = Math.ceil(superficie * 0.35);
            const arenaMetros = (superficie * 0.08).toFixed(2);
            const totalManoObra = superficie * valorMano;

            const resDiv = document.getElementById('resultado');
            resDiv.style.display = 'block';
            resDiv.innerHTML = `
                <strong>Cliente:</strong> ${cliente}<br>
                <strong>🧱 Ladrillos estimados:</strong> ${ladrillos} unidades<br>
                <strong>📦 Cemento:</strong> ${cementoBolsas} bolsas<br>
                <strong>砂 Arena:</strong> ${arenaMetros} m³<br>
                <strong>💰 Total Mano de Obra:</strong> $${totalManoObra.toLocaleString()}
            `;
        }
    </script>
</body>
</html>
